[phases.setup]
nixPkgs = ["nodejs_20"]
cmds = ["corepack enable", "corepack prepare pnpm@10 --activate"]

[phases.install]
cmds = ["cd apps/web && pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["cd apps/web && pnpm run build"]

[start]
cmd = "cd apps/web && ./node_modules/.bin/next start -p $PORT"
